<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a5cf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>oliveira</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --line:#e6e8ee; --txt:#1c2430; --sub:#7a8494;
  --accent:#4a5cf0; --accent-soft:#eef0fe; --ok:#16a34a;
  --red-bg:#fef2f2; --red-tx:#b91c1c; --amber-bg:#fffbeb; --amber-tx:#b45309;
  --blue-bg:#eff6ff; --blue-tx:#1d4ed8; --pink-bg:#fdf2f8; --pink-tx:#be185d;
  --radius:14px;
}
[data-theme=dark]{
  --bg:#0f1218; --card:#161b24; --line:#262d3a; --txt:#e8ecf3; --sub:#8b95a5;
  --accent:#6c7ff5; --accent-soft:#1d2340;
  --red-bg:#2a1a1c; --red-tx:#fca5a5; --amber-bg:#26200f; --amber-tx:#fcd34d;
  --blue-bg:#131c2e; --blue-tx:#93c5fd; --pink-bg:#281722; --pink-tx:#f9a8d4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical}

.shell{display:flex;min-height:100vh}
.side{width:216px;flex-shrink:0;padding:22px 16px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 18px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex-shrink:0}
.brand b{font-size:15.5px;display:block;letter-spacing:.5px}
.brand span{font-size:11.5px;color:var(--sub)}
.nav{display:flex;flex-direction:column;gap:4px}
.tab{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--sub);padding:10px 12px;border-radius:10px;text-align:left;font-size:14px;transition:all .15s}
.tab:hover{background:var(--bg);color:var(--txt)}
.tab.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:1px solid var(--line)}
.streak{font-size:13px;color:var(--sub)}
.streak b{color:var(--txt)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--sub);font-size:13px;transition:all .15s}
.ghost:hover{color:var(--txt);border-color:var(--sub)}
main{flex:1;padding:26px 34px 60px;max-width:1040px;margin:0 auto;width:100%}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;margin-bottom:18px}
.daynav{display:flex;align-items:center;gap:12px}
.daynav>button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:16px;transition:all .15s}
.daynav>button:hover{color:var(--txt);border-color:var(--sub)}
.daylabel b{font-size:19px;display:block}
.daylabel span{font-size:12.5px;color:var(--sub)}
#todayBtn{border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:9px;padding:6px 12px;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:520px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:12.5px}
.chip i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chip b{color:var(--sub);font-weight:600;font-size:11.5px}
.chip.dead{border-color:#fecaca;background:#fff5f5}
.chip.warn{border-color:#fde68a;background:#fffbeb}
.chip.event{border-color:#bfdbfe;background:#eff6ff}
.chip.proj{border-color:#fbcfe8;background:#fdf2f8}
[data-theme=dark] .chip.dead{border-color:#5b2a2a;background:#251417}
[data-theme=dark] .chip.warn{border-color:#5b4a1a;background:#221c0d}
[data-theme=dark] .chip.event{border-color:#26436b;background:#131c2e}
[data-theme=dark] .chip.proj{border-color:#5b2a46;background:#241422}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.cardtitle{font-weight:700;font-size:15px;margin-bottom:12px}
.cardtitle .dim{font-weight:400;font-size:12px;color:var(--sub);margin-left:8px}
.dim{color:var(--sub)}
.muted{color:var(--sub);font-size:13px;padding:8px 0}
h4{margin:18px 0 8px;font-size:14px}

.row{display:flex;gap:16px;align-items:stretch}
.row .card{margin-bottom:16px}
.ringcard{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:210px;text-align:center}
.ringsvg{width:128px;height:128px}
.ringtxt{font-size:20px;font-weight:700;fill:var(--txt)}
.ringinfo{margin-top:6px}
.ringinfo b{font-size:15px;display:block}
.ringinfo span{font-size:12.5px;color:var(--sub)}
.grow{flex:1;min-width:0}

.banner{border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.banner.dead{background:var(--red-bg);color:var(--red-tx)}
.banner.warn{background:var(--amber-bg);color:var(--amber-tx)}
.banner.event{background:var(--blue-bg);color:var(--blue-tx)}
.banner.proj{background:var(--pink-bg);color:var(--pink-tx)}
.banner span{overflow-wrap:anywhere;flex:1;min-width:0}

.tasklist{display:flex;flex-direction:column}
.task{display:flex;gap:12px;padding:11px 2px;border-bottom:1px dashed var(--line);align-items:flex-start}
.task:last-of-type{border-bottom:0}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:transparent;font-size:12px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.chk:hover{border-color:var(--accent)}
.task.done .chk{background:var(--accent);border-color:var(--accent);color:#fff}
.taskbody{flex:1;min-width:0}
.taskx{font-size:14px;overflow-wrap:anywhere}
.task.done .taskx{color:var(--sub);text-decoration:line-through}
.taskmeta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12px;color:var(--sub);margin-top:3px}
.tag{font-size:12px;flex-shrink:0}
.mini{background:none;border:0;color:var(--sub);font-size:12px;padding:0;text-decoration:underline dotted}
.mini:hover{color:var(--accent)}
.mini.del:hover{color:#ef4444}
.task.inc .taskx{color:var(--amber-tx)}
.task.inc .chk{border-color:#fcd34d}
.longrow{padding:8px 0;border-bottom:1px dashed var(--line)}
.longrow:last-of-type{border-bottom:0}
.longtop{display:flex;gap:10px;align-items:center}
.longtop b{font-size:14px}
.longtop .mini{margin-left:auto}
.tnote{width:100%;margin-top:8px;font-size:13px}
.addrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.addrow #newx{flex:1;min-width:150px}
.addrow #newm{width:76px}
.primary{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:8px 14px;font-size:13.5px;transition:opacity .15s}
.primary:hover{opacity:.9}
.summary{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.summary span{font-size:13px;color:var(--sub);display:block;margin-bottom:6px}
.summary textarea{width:100%;min-height:64px;font-size:13.5px}

/* ===== 课表 ===== */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table.tt{width:100%;border-collapse:collapse;min-width:780px;font-size:12.5px}
table.tt th,table.tt td{border:1px solid var(--line);padding:5px 7px;vertical-align:middle}
table.tt thead th{background:var(--bg);font-weight:600;padding:9px 6px;font-size:13px}
table.tt thead small{display:block;font-weight:400;color:var(--sub);font-size:11px}
td.pt{width:78px;text-align:center;color:var(--sub);background:var(--bg);font-size:11.5px;position:sticky;left:0;z-index:2}
td.pt b{display:block;color:var(--txt);font-size:12px;font-weight:600}
td.pt small{display:block;color:var(--accent);font-size:10.5px;margin-top:2px}
td.em{background:transparent}
td.cls{background:var(--card)}
.c{padding:2px 1px}
.c b{display:block;font-size:12.5px;line-height:1.3;overflow-wrap:anywhere}
.c span{display:block;color:var(--sub);font-size:11px;margin:1px 0}
.c small{display:block;color:var(--sub);font-size:10.5px}
.c em{display:block;color:var(--amber-tx);font-size:10.5px;font-style:normal;margin-top:2px}
.c.off{opacity:.42}
.c.ovl{background:var(--amber-bg);border-radius:8px;padding:4px 5px}
th.colnow,td.colnow{background:var(--accent-soft)}
tr.nowp td.pt{background:var(--accent-soft)}
tr.nowp td.pt b,tr.nowp td.pt small{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:12px;font-size:12px;color:var(--sub)}
.legend i{width:8px;height:8px;border-radius:3px;display:inline-block;margin-right:5px}

/* ===== 本周 ===== */
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.daycard{border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;cursor:pointer;background:var(--bg);transition:all .15s}
.daycard:hover{border-color:var(--accent)}
.daycard.isnow{border-color:var(--accent);background:var(--accent-soft)}
.daycard.isnow .dtop b{color:var(--accent)}
.dtop{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-bottom:8px}
.dtop b{color:var(--txt)}
.dnum{font-size:19px;font-weight:700}
.dnum i{font-style:normal;font-size:12px;color:var(--sub)}
.daycard .bar{margin:8px 0}
.dsub{font-size:11.5px;color:var(--sub)}

.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.totals{display:flex;flex-wrap:wrap;gap:24px;align-items:center;margin-bottom:14px}
.totbig{font-size:22px;font-weight:700}
.totbig i{font-style:normal;font-size:13px;color:var(--sub);font-weight:400}
.subjrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.subjname{width:64px;flex-shrink:0;font-size:13px;display:flex;align-items:center;gap:6px}
.subjname i{width:8px;height:8px;border-radius:50%}
.subjrow .bar{flex:1}
.subjval{width:52px;text-align:right;font-size:12.5px;color:var(--sub);flex-shrink:0}
.adminbar{max-width:420px}
.adminbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.adminbtns button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--txt)}
.adminbtns button:hover{border-color:var(--sub)}
.over{color:var(--red-tx);font-weight:700}

/* ===== 统计 ===== */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.statgrid .card{margin-bottom:0}
.stat b{font-size:13px;color:var(--sub);font-weight:500}
.stat .big{font-size:26px;font-weight:700;margin:6px 0 2px}
.stat .big i{font-style:normal;font-size:13px;color:var(--sub);font-weight:400}
.daybars{display:flex;gap:8px;align-items:flex-end;padding:8px 4px 0}
.daybarcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.barwrap{height:130px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;width:100%}
.bar.v{width:26px;height:100%;display:flex;align-items:flex-end}
.bar.v i{width:100%;background:var(--accent);border-radius:6px 6px 0 0}
.isnow .bar.v i{background:var(--ok)}
.bval{font-size:11.5px;color:var(--sub)}
.blab{font-size:11.5px;color:var(--sub)}

.wghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.wghead b{font-size:15px}
.wghead span{font-size:12.5px;color:var(--sub)}
.wggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.wgd{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.wgd b{font-size:14px}
.wgd span{font-size:12px;color:var(--sub)}
.wgd small{font-size:11.5px;color:var(--sub)}
.wgd.due{border-color:var(--accent);background:var(--accent-soft)}
.wgd.due small{color:var(--accent);font-weight:600}
.wgd.over{border-color:#fecaca}
.wgd.over small{color:var(--red-tx);font-weight:600}
.wgd.clear{opacity:.55}
.wgmini{display:block;height:5px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}
.wgmini em{display:block;height:100%;background:var(--ok)}
.wgd.due .wgmini em{background:var(--accent)}

/* ===== 计划 ===== */
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.goal{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.goal b{display:block;font-size:13.5px}
.goal span{font-size:20px;font-weight:700;color:var(--accent)}
.goal i{font-style:normal;font-size:11.5px;color:var(--sub);display:block;margin-top:2px}
.rule{display:flex;gap:10px;padding:8px 0;align-items:flex-start}
.rule>b{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px}
.rule p{margin:0;font-size:13.5px}
table.grid{width:100%;border-collapse:collapse;font-size:13px}
table.grid th,table.grid td{border:1px solid var(--line);padding:8px 10px;text-align:center}
table.grid th{background:var(--bg);font-weight:600}
table.grid td:first-child{color:var(--sub)}
.tl{display:flex;flex-direction:column;gap:14px;padding-left:2px}
.tlitem{display:flex;gap:10px;align-items:flex-start}
.tlitem>i{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0}
.tlitem b{display:block;font-size:13.5px}
.tlitem .dim{font-size:12px}
.tldate{font-size:12px;color:var(--sub);flex-shrink:0;width:44px;padding-top:1px}
.danger{color:var(--red-tx)}
.courselist{display:flex;flex-direction:column;gap:6px}
.cl{display:flex;gap:10px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.cl:last-of-type{border-bottom:0}
.cl i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cl b{min-width:120px}
.cl span{color:var(--sub)}
.cl small{margin-left:auto;color:var(--sub);white-space:nowrap}

/* ===== 时间分组 ===== */
.secthead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub);background:var(--bg);border-radius:9px;padding:7px 12px;margin:12px 0 2px;font-weight:600}
.secthead span{font-weight:400;font-size:11.5px}

/* ===== 账户 ===== */
.acct{display:flex;flex-direction:column;gap:14px}
.acct .steps{padding-left:20px;margin:8px 0}
.acct .steps li{margin:4px 0;font-size:13px;color:var(--sub)}
.acct .steps b{color:var(--txt)}
.patrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.patrow input{flex:1;min-width:220px;font-family:Consolas,Menlo,monospace;font-size:13px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border-radius:999px;padding:4px 12px;border:1px solid var(--line);color:var(--sub)}
.status.ok{color:var(--ok);border-color:#bbf7d0;background:#f0fdf4}
.status.err{color:var(--red-tx);border-color:#fecaca;background:var(--red-bg)}
[data-theme=dark] .status.ok{background:#0e2a1a;border-color:#1f5136}
.avrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.avrow .av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.gridwrap{overflow-x:auto}

@media (max-width:860px){
  .shell{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:column;padding:14px 16px}
  .brand{padding-bottom:10px}
  .nav{flex-direction:row;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .side-foot{flex-direction:row;align-items:center;padding-top:10px;gap:12px;flex-wrap:wrap}
  main{padding:16px 14px 70px}
  .top{flex-direction:column;align-items:stretch;gap:10px}
  .chips{justify-content:flex-start;max-width:none}
  .row{flex-direction:column}
  .ringcard{flex-direction:row;gap:18px;min-width:0}
  .ringsvg{width:104px;height:104px}
  .chk{width:28px;height:28px;font-size:13px;margin-top:0}
  .task{padding:12px 0;gap:10px}
  .mini{padding:4px 8px;margin:-2px 0}
  .addrow #newx{flex:1 1 100%}
  .addrow select{flex:1;min-width:110px}
  .addrow #newm{width:70px}
  .weekgrid{display:flex;overflow-x:auto;padding-bottom:6px}
  .daycard{min-width:82px;flex:1}
  .daybars{overflow-x:auto;padding-bottom:4px}
  .daybarcol{min-width:44px}
  .statgrid{grid-template-columns:1fr}
  .wggrid{grid-template-columns:repeat(2,1fr)}
  .goals{grid-template-columns:repeat(2,1fr)}
  .cl{flex-wrap:wrap}
  .cl b{min-width:90px}
  .cl small{margin-left:0;width:100%}
  .totals{gap:14px}
  .tblwrap{margin:0 -4px}
  .patrow input{min-width:100%}
}
@media (max-width:400px){
  .goals{grid-template-columns:1fr}
  .wggrid{grid-template-columns:1fr 1fr}
  .daynav{gap:8px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="logo">o</div><div><b>oliveira</b><span id="brandWeek">2026–2027 第一学期</span></div></div>
    <nav class="nav">
      <button class="tab" data-act="tab|today">📋 今日</button>
      <button class="tab" data-act="tab|tt">🗓 课表</button>
      <button class="tab" data-act="tab|week">📆 本周</button>
      <button class="tab" data-act="tab|stats">📊 统计</button>
      <button class="tab" data-act="tab|plan">🧭 计划</button>
      <button class="tab" data-act="tab|acct">👤 账户</button>
    </nav>
    <div class="side-foot">
      <div class="streak">🔥 连续打卡 <b id="streakN">0</b> 天</div>
      <button class="ghost" data-act="theme" id="themeBtn">🌙 深色</button>
      <button class="ghost" data-act="export">⬇ 导出数据</button>
    </div>
  </aside>
  <main>
    <header class="top">
      <div class="daynav">
        <button data-act="day|-1" title="前一天">‹</button>
        <div class="daylabel"><b id="dayBig">…</b><span id="daySub"></span></div>
        <button data-act="day|1" title="后一天">›</button>
        <button id="todayBtn" data-act="day|0">回到今天</button>
      </div>
      <div class="chips" id="chips"></div>
    </header>
    <section id="view"></section>
  </main>
</div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
'use strict';
/* ================= 常量与数据 ================= */
const LS='jiangpan-study-v1';
const PLAN_START='2026-10-20';
const TERM='2026–2027 第一学期';
const SUB={
  '高数':'#3b82f6','线代':'#8b5cf6','C++':'#10b981','英语':'#f59e0b','单词':'#f97316',
  '项目':'#ec4899','综合':'#64748b','上课':'#0ea5e9','生活':'#94a3b8','事务':'#a8a29e'
};
const SUB_ORDER=['高数','线代','C++','英语','单词','项目','综合','上课','生活','事务'];

/* ================= 云端同步（GitHub Gist · 无服务器） ================= */
const GIST_DESC='oliveira-study-data-v1';
const ghFetch=(url,opt)=>{
  const f=typeof fetch==='function'?fetch:()=>Promise.reject(new Error('当前环境不支持网络请求'));
  return f(url,opt);
};
async function ghApi(path,opts){
  const s=state.sync||{};
  opts=opts||{};
  const headers=Object.assign({'Authorization':'token '+s.token,'Accept':'application/vnd.github+json'},opts.headers||{});
  const r=await ghFetch('https://api.github.com'+path,Object.assign({},opts,{headers}));
  if(!r.ok) throw new Error(r.status===401?'Token 无效或未勾选 gist 权限':('GitHub 请求失败 '+r.status));
  return r.json();
}
async function ensureGist(){
  const s=state.sync||{};
  if(s.gistId)return s.gistId;
  for(let page=1;page<=3;page++){
    const list=await ghApi('/gists?per_page=100&page='+page);
    const found=(list||[]).find(g=>g.description===GIST_DESC);
    if(found){s.gistId=found.id;persistRaw();return found.id;}
    if((list||[]).length<100)break;
  }
  const created=await ghApi('/gists',{method:'POST',body:JSON.stringify({description:GIST_DESC,public:false,files:{'oliveira-data.json':{content:JSON.stringify({app:'oliveira',v:1,ts:0,data:{checks:{},word:{},custom:{},notes:{},admin:{}}})}}})});
  s.gistId=created.id;persistRaw();return created.id;
}
function mergeData(a,b){
  const out={checks:{},word:{},custom:{},notes:{},admin:{},roll:[],long:[]};
  const d1=a.checks||{},d2=b.checks||{};
  new Set([...Object.keys(d1),...Object.keys(d2)]).forEach(ds=>{
    out.checks[ds]={};
    const c1=d1[ds]||{},c2=d2[ds]||{};
    new Set([...Object.keys(c1),...Object.keys(c2)]).forEach(id=>{
      const x=c1[id],y=c2[id];
      out.checks[ds][id]=x&&y?((y.t||0)>(x.t||0)?y:x):(x||y);
    });
  });
  GROUPS.forEach(g=>{
    const x=(a.word||{})[g.name],y=(b.word||{})[g.name];
    if(x&&y)out.word[g.name]=y>x?y:x;
    else if(x||y)out.word[g.name]=x||y;
  });
  new Set([...Object.keys(a.custom||{}),...Object.keys(b.custom||{})]).forEach(ds=>{
    const list=(a.custom[ds]||[]).slice().concat((b.custom[ds]||[]).slice());
    const seen={};
    out.custom[ds]=list.filter(c=>{if(seen[c.id])return false;seen[c.id]=1;return true;});
  });
  new Set([...Object.keys(a.notes||{}),...Object.keys(b.notes||{})]).forEach(ds=>{
    out.notes[ds]=(a.notes&&a.notes[ds])||(b.notes&&b.notes[ds])||'';
  });
  new Set([...Object.keys(a.admin||{}),...Object.keys(b.admin||{})]).forEach(wk=>{
    out.admin[wk]=Math.max(a.admin[wk]||0,b.admin[wk]||0);
  });
  ((a.roll||[]).concat(b.roll||[])).forEach(r=>{
    if(!out.roll.some(x=>x.id===r.id))out.roll.push(r);
  });
  ((a.long||[]).concat(b.long||[])).forEach(l=>{
    if(!out.long.some(x=>x.id===l.id))out.long.push(l);
  });
  return out;
}
function curData(){return {checks:state.checks,word:state.word,custom:state.custom,notes:state.notes,admin:state.admin,roll:state.roll||[],long:state.long||[]};}
async function pushCloud(){
  const s=state.sync||{};
  if(!s.token)return;
  try{
    const id=await ensureGist();
    const envelope={app:'oliveira',v:1,ts:Date.now(),data:curData()};
    await ghApi('/gists/'+id,{method:'PATCH',body:JSON.stringify({files:{'oliveira-data.json':{content:JSON.stringify(envelope)}}})});
    s.lastSync=Date.now();
    s.status='已同步 '+new Date(s.lastSync).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    persistRaw();
  }catch(e){
    s.status='同步失败：'+(e.message||e);
    persistRaw();
  }
}
async function syncNow(){
  const s=state.sync||{};
  if(!s.token)return;
  s.status='同步中…';persistRaw();render();
  try{
    const id=await ensureGist();
    const g=await ghApi('/gists/'+id);
    let cloud=null;
    try{cloud=JSON.parse((g.files['oliveira-data.json']||{}).content||'null');}catch(e){cloud=null;}
    const merged=mergeData(curData(),(cloud&&cloud.data)||{checks:{},word:{},custom:{},notes:{},admin:{}});
    Object.assign(state,merged);
    await pushCloud();
  }catch(e){
    s.status='同步失败：'+(e.message||e);
    persistRaw();
  }
  render();
}

    if(!r.ok)throw new Error(r.status===401?'Token 无效或无权限（需勾选 gist）':'GitHub 请求失败 '+r.status);
    const u=await r.json();
    state.sync={token:pat.trim(),user:u.login||u.name||'github',gistId:null,auto:true,lastSync:0,status:'登录成功，正在同步…'};
    persistRaw();
    const id=await ensureGist();

/* ================= 任务生成（每天自动更新） ================= */
function engRitual(ds){
  if(ds==='2026-10-25') return '英语仪式：周清——关键句默写 + 250 词抽查';
  if(ds<PLAN_START) return '英语仪式：新概念 2 第 1 课（听 3 遍 → 跟读 → 默写）';
  let n=0;
  for(let d=parse(PLAN_START);dstr(d)<=ds;d=addDays(d,1)){
    const s=dstr(d);
    if(s==='2026-10-25')continue;
    if(SPORT.includes(s))continue;
    n++;
  }
  if(n>96)n=96;
  return '英语仪式：新概念 2 第 '+n+' 课（听 3 遍 → 跟读 → 默写关键句）'+(n===96?' · 全册完成后自由回听':'');
}
function groupInfo(g){
  const dues=OFFS.map(o=>dstr(addDays(parse(g.start),o)));
  const last=state.word[g.name]||dstr(addDays(parse(g.start),-1));
  const done=dues.filter(x=>x<=last).length;
  const next=dues[done]||null;
  return {g,dues,done,next,total:dues.length};
}
function dueGroups(ds){
  return GROUPS.map(groupInfo).filter(i=>i.next&&i.next<=ds).map(i=>i.g);
}
function markWord(ds){
  GROUPS.forEach(g=>{const i=groupInfo(g);if(i.next&&i.next<=ds)state.word[g.name]=ds;});

function tasksFor(d){
  const ds=dstr(d);const out=[];
  const isSport=SPORT.includes(ds),isExam=EXAM.includes(ds);
  const sprint=ds>=SPRINT_START&&ds<=SPRINT_END;

    out.push({id:'sp2',t:'全天',x:'运动会：参加 / 观赛 / 休息，别透支',s:'生活',m:30});
  }else if(isExam){
    out.push({id:'ex0',t:'上午',x:'期中考试：冷静审题，先易后难，留时间检查',s:'综合',m:120});
    out.push({id:'ex1',t:'考后',x:'错题登记 + 复盘下一科安排',s:'综合',m:60});
  }else{
    (DAY[d.getDay()]||[]).forEach((b,i)=>{
      if(b.course){
        const c=COURSES.find(x=>x.key===b.course);
        const active=c&&courseActive(c,wk);
        if(active) out.push({id:'k'+b.course,t:pTime(c.a,c.b),x:'【上课】'+c.name+'（'+c.t+' · '+c.r+'）'+(c.tip?' '+c.tip:''),s:'上课',m:(c.b-c.a+1)*45});
        else if(b.alt) out.push({id:'b'+i,t:b.alt.t,x:b.alt.x,s:b.alt.s,m:b.alt.m});
      }else if(b.onlyIf){

        if(b.id==='sunam') x=wk>=10?'线代：错题重做 + 模拟卷':'线代期中模拟整卷（计时 + 批改）';
        out.push({id:'b'+i,t:b.t,x:x,s:b.s,m:b.m});
      }
    });
    if(sprint){
      out.push({id:'sp2',t:'额外 1h',x:'高数：错题重做（冲刺周每日加练）',s:'高数',m:60});
      out.push({id:'sp3',t:'额外 30min',x:'线代：周清节奏打卡',s:'线代',m:30});

const isDone=(c,id)=>{const r=c[id];return !!r&&!r.inc;};
function hasAnyDone(ds){

function streak(){

function totalsBetween(a,b){
  const mins={},r={mins,total:0,doneCount:0,taskCount:0};
  for(let d=parse(a);dstr(d)<=b;d=addDays(d,1)){

const BUDGET=780;
function planMinutes(ds){
  return tasksFor(parse(ds)).reduce((a,t)=>a+t.m,0);

function allocTarget(afterDs){
  const todayStr=dstr(new Date());
  let base=afterDs>todayStr?parse(afterDs):new Date();
  (state.roll||[]).forEach(r=>{if(r.target&&r.target>dstr(base))base=parse(r.target);});
  let d=addDays(base,1);
  for(let i=0;i<90;i++){
    const ds=dstr(d);
    if(!SPORT.includes(ds)&&!EXAM.includes(ds))return ds;
    d=addDays(d,1);
  }
  return dstr(d);
}
function rollInfo(ds,id){
  return (state.roll||[]).find(r=>r.origin===id&&r.originDs===ds)||null;
}
function markIncomplete(ds,id){
  const t=tasksFor(parse(ds)).find(x=>x.id===id);
  if(!t)return;
  const c=state.checks[ds]=state.checks[ds]||{};
  if(c[id]&&c[id].inc){
    delete c[id].inc;
    state.roll=(state.roll||[]).filter(r=>!(r.origin===id&&r.originDs===ds));
  }else{
    c[id]=Object.assign({},c[id]||{}, {inc:true});
    if(id.indexOf('roll_')===0){
      const old=(state.roll||[]).find(r=>r.id===id);
      state.roll=(state.roll||[]).filter(r=>r.id!==id);
      state.roll.push({id:'roll_'+Date.now()+Math.floor(Math.random()*1000),x:t.x,s:t.s,m:t.m,t0:(old&&old.t0)||t.t.replace(/^🔁 /,''),from:ds,target:allocTarget(ds)});
      delete c[id];
    }else{
      state.roll.push({id:'roll_'+Date.now()+Math.floor(Math.random()*1000),x:t.x,s:t.s,m:t.m,t0:t.t,from:ds,target:allocTarget(ds),origin:id,originDs:ds});
    }
  }
  save();render();
}
function longMins(l,ds){
  if(l.start&&ds<l.start)return 0;
  if(l.deadline&&ds>l.deadline)return 0;
  if(l.weeklyMinutes)return Math.max(0,Math.round(l.weeklyMinutes/7));
  if(l.totalMinutes&&l.deadline){
    const today=dstr(new Date());
    const baseDs=ds>today?ds:today;
    const days=Math.max(1,diffDays(baseDs,l.deadline)+1);
    const remain=Math.max(0,l.totalMinutes-(l.done||0));
    return Math.min(180,Math.max(15,Math.round(remain/days)));
  }
  return 30;
}

  const m=String(t||'').match(/(\d{1,2}):(\d{2})/);

  if(s.indexOf('全天')>=0)return 500;

  if(s.indexOf('下午')>=0)return 840;
  if(s.indexOf('晚上')>=0)return 1150;
  if(s.indexOf('上午')>=0)return 500;
  return 950;
}

function viewTimetable(){

    +'<div class="tlitem"><span class="tldate">暑假</span><i style="background:#f59e0b"></i><div><b>7 – 8 月</b><span class="dim">8.02 完结 + 8.03 开始 + 托福首考 100+</span></div></div>'
    +'<div class="tlitem"><span class="tldate">大二</span><i style="background:#ec4899"></i><div><b>全年</b><span class="dim">专业课全 A + 科研入门 + 竞赛国奖</span></div></div>'
    +'</div></div>'
    +'<div class="card"><div class="cardtitle">课程资源速查</div>'
    +'<div class="muted"><b>C++</b>：黑马程序员（B 站，学期内 8–15 周）→ Stanford CS106B（寒假）→ MIT 6.006 先修 → UE5 C++</div>'
    +'<div class="muted"><b>物理</b>：王稼军《大学物理》MOOC（校内衔接）→ MIT 8.01 Lewin（寒假）→ 8.02 / 8.03</div>'
    +'<div class="muted"><b>英语</b>：新概念 2 每日 1 课 + 百词斩 3500 + 艾宾浩斯 227 词表（11.18 清零）</div></div>'
    +'<div class="card"><div class="cardtitle">数据管理</div>'
    +'<div class="muted">数据保存在本浏览器 localStorage；在「账户」页登录 GitHub 后可自动同步到云端私有 Gist，换设备登录同一账号即恢复。导出 JSON 可手动备份 / 迁移。</div>'
    +'<div class="adminbtns"><button class="ghost" data-act="export">⬇ 导出数据（JSON）</button><button class="ghost" data-act="import">⬆ 导入数据</button><button class="ghost" data-act="reset">🗑 清空数据</button></div></div>';
}

/* ================= 动作 ================= */
function toggle(ds,id){
  const c=state.checks[ds]=state.checks[ds]||{};
  const rec=c[id];
  if(rec){
    if(rec.inc){
      state.roll=(state.roll||[]).filter(r=>!(r.origin===id&&r.originDs===ds));
      delete rec.inc;
    }
    if(id.indexOf('long')===0){
      const l=(state.long||[]).find(x=>'long'+x.id===id);
      const t=tasksFor(parse(ds)).find(x=>x.id===id);
      if(l)l.done=Math.max(0,(l.done||0)-(t?t.m:0));
    }
    delete c[id];
    if(id.indexOf('roll_')===0){
      const r=(state.roll||[]).find(x=>x.id===id);
      if(r)r.target=ds;
    }
  }else{
    c[id]={t:Date.now(),note:''};
    if(id==='word')markWord(ds);
    if(id.indexOf('roll_')===0){
      state.roll=(state.roll||[]).filter(x=>x.id!==id);
    }
    if(id.indexOf('long')===0){
      const l=(state.long||[]).find(x=>'long'+x.id===id);
      const t=tasksFor(parse(ds)).find(x=>x.id===id);
      if(l)l.done=(l.done||0)+(t?t.m:0);
    }
  }
  save();render();
}
function delCustom(ds,id){
  state.custom[ds]=(state.custom[ds]||[]).filter(c=>c.id!==id);
  const c=state.checks[ds]||{};
  delete c[id];
  save();render();
}
function addCustomFromForm(){
  const x=$('#newx').value.trim();
  if(!x)return;
  const s=$('#news').value,slot=($('#newslot')&&$('#newslot').value)||'随时';
  const m=Math.max(5,parseInt($('#newm').value,10)||30);
  const ds=dstr(viewDate);
  let targetDs=ds;
  if(planMinutes(ds)+m>BUDGET){
    targetDs=allocTarget(ds);
    state.toast={ds:targetDs,text:'今日计划已排满（超过 '+Math.round(BUDGET/60)+' 小时），「'+x.slice(0,14)+'」已自动顺延至 '+targetDs.slice(5).replace('-','/')};
  }
  state.custom[targetDs]=state.custom[targetDs]||[];
  state.custom[targetDs].push({id:'c'+Date.now()+Math.floor(Math.random()*1000),x,s,m,slot,ts:Date.now()});
  $('#newx').value='';
  save();render();
  const nx=$('#newx');if(nx)nx.focus();
}
function adminAdj(n){
  const wk=weekKey(new Date());
  state.admin[wk]=Math.max(0,(state.admin[wk]||0)+n);
  save();render();
}
function exportData(){
  const s=state.sync;
  const out=Object.assign({},state,{sync:s?{user:s.user,gistId:s.gistId,auto:s.auto,lastSync:s.lastSync,status:s.status}:null});
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='oliveira-数据-'+dstr(new Date())+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ================= 渲染 ================= */
function render(){
  document.documentElement.dataset.theme=state.dark?'dark':'light';
  $('#themeBtn').textContent=state.dark?'☀️ 浅色':'🌙 深色';
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.act==='tab|'+tab));
  const ds=dstr(viewDate),isToday=ds===dstr(new Date());
  $('#dayBig').textContent=fmt(viewDate);
  $('#daySub').textContent=WD[viewDate.getDay()]+' · 第 '+weekNum(ds)+' 周'+(isToday?' · 今天':'');
  $('#todayBtn').style.display=isToday?'none':'';
  $('#streakN').textContent=streak();
  $('#brandWeek').textContent=TERM+' · 第 '+weekNum(ds)+' 周';
  $('#chips').innerHTML=chipsHTML();
  const V={today:viewToday,tt:viewTimetable,week:viewWeek,stats:viewStats,plan:viewPlan,acct:viewAccount}[tab];
  $('#view').innerHTML=V();
}

/* ================= 事件 ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t)return;
  const p=t.dataset.act.split('|');
  const act=p[0];
  if(act==='tab'){tab=p[1];render();}
  else if(act==='day'){const n=+p[1];viewDate=n===0?new Date():addDays(viewDate,n);render();}
  else if(act==='godate'){viewDate=parse(p[1]);tab='today';render();}
  else if(act==='check'){toggle(p[1],p[2]);}
  else if(act==='note'){const k=p[1]+'|'+p[2];noteOpen.has(k)?noteOpen.delete(k):noteOpen.add(k);render();}
  else if(act==='del'){delCustom(p[1],p[2]);}
  else if(act==='add'){addCustomFromForm();}
  else if(act==='inc'){markIncomplete(p[1],p[2]);}
  else if(act==='addlong'){addLongFromForm();}
  else if(act==='dellong'){state.long=(state.long||[]).filter(l=>l.id!==p[1]);save();render();}
  else if(act==='admin'){adminAdj(+p[1]);}
  else if(act==='theme'){state.dark=!state.dark;save();render();}
  else if(act==='export'){exportData();}
  else if(act==='import'){document.getElementById('imp').click();}
  else if(act==='login'){loginAction();}
  else if(act==='syncnow'){syncNow();}
  else if(act==='autosync'){const s=state.sync||{};s.auto=s.auto===false;state.sync=s;save();render();}
  else if(act==='logout'){state.sync=null;save();render();}
  else if(act==='reset'){
    if(confirm('确定清空所有打卡数据？此操作不可恢复，建议先导出备份。')){
      localStorage.removeItem(LS);
      location.reload();
    }
  }
});
document.addEventListener('input',e=>{
  const t=e.target.closest('[data-in]');
  if(!t)return;
  const p=t.dataset.in.split('|');
  if(p[0]==='summary'){state.notes[p[1]]=t.value;}
  else{
    const c=state.checks[p[1]]=state.checks[p[1]]||{};
    const r=c[p[2]]=c[p[2]]||{t:Date.now(),note:''};
    r.note=t.value;
  }
  save();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='newx')addCustomFromForm();
  if(e.key==='Enter'&&e.target&&e.target.id==='pat')loginAction();
  if(e.key==='Enter'&&e.target&&e.target.id==='longname')addLongFromForm();
});
document.getElementById('imp').addEventListener('change',e=>{
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      state=Object.assign({checks:{},word:{},custom:{},notes:{},admin:{},dark:state.dark},o,{sync:state.sync||null});
      save();render();
    }catch(err){alert('导入失败：文件格式不正确。');}
  };
  r.readAsText(f);
  e.target.value='';
});

/* 跨午夜自动刷新 */
setInterval(()=>{
  if(dstr(viewDate)!==dstr(new Date())&&tab==='today'){viewDate=new Date();render();}
},60000);

/* 本地存储可用性提示 */
(function(){
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}
  catch(e){
    const b=document.createElement('div');
    b.className='banner dead';
    b.innerHTML='<b>⚠</b><span>浏览器禁用了本地存储，打卡数据将无法保存（可能是无痕模式）。</span>';
    document.querySelector('main').prepend(b);
  }
})();

render();
</script>
